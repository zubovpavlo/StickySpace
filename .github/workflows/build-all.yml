name: StickySpace - Build all platforms

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stickyspace-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-web:
    name: Android and Web (Linux runner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Fetch packages
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release
      - name: Build Android APKs (32-bit and 64-bit)
        run: flutter build apk --release --split-per-abi

  windows:
    name: Windows (Windows runner)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Fetch packages
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release

  apple:
    name: macOS and iOS (Mac runner)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Fetch packages
        run: flutter pub get
      # Temporary workaround for Flutter issue #191575 (macOS AOT _Rect crash).
      # This changes the CI runner's Flutter SDK only; it does not edit app code.
      # Remove when fixed in the pinned Flutter release.
      - name: Work around Flutter macOS AOT windowing crash
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil

          flutter = shutil.which("flutter")
          if not flutter:
              raise SystemExit("Flutter executable not found")
          sdk_root = Path(flutter).resolve().parents[1]
          target = sdk_root / "packages/flutter/lib/src/foundation/_features.dart"
          old = "bool isWindowingEnabled = debugEnabledFeatureFlags.contains('windowing');"
          new = "bool isWindowingEnabled = false;"
          source = target.read_text(encoding="utf-8")
          if source.count(old) != 1:
              raise SystemExit(f"Flutter SDK layout has changed: {target}")
          target.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Disabled experimental windowing in macOS CI Flutter SDK")
          PYCODE
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
